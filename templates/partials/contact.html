{% load static %}
<section id="contact" class="section-container">
  <div class="section-header">
    <div class="badge badge-cyan" style="margin-bottom: 12px;">
      <span>📬 Let's Connect</span>
    </div>
    <h2>Get In <span class="gradient-text">Touch</span></h2>
    <p>Have a project inquiry, collaboration opportunity, or just want to say hi? Send me a message!</p>
  </div>

  <div style="max-width: 700px; margin: 0 auto;">
    <div class="glass-panel" style="padding: 36px; border: 1px solid var(--border-accent);">
      <form id="portfolio-contact-form">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;">
          <!-- Name -->
          <div class="form-group">
            <label class="form-label" for="contact-name">Full Name *</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              class="form-input"
              placeholder="e.g. John Doe"
              required
            >
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="contact-email">Email Address *</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              class="form-input"
              placeholder="john@example.com"
              required
            >
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;">
          <!-- Phone -->
          <div class="form-group">
            <label class="form-label" for="contact-phone">Phone Number (Optional)</label>
            <input
              type="tel"
              id="contact-phone"
              name="phone"
              class="form-input"
              placeholder="+91 98765 43210"
            >
          </div>

          <!-- Subject -->
          <div class="form-group">
            <label class="form-label" for="contact-subject">Subject</label>
            <input
              type="text"
              id="contact-subject"
              name="subject"
              class="form-input"
              placeholder="Project Collaboration / Hiring"
            >
          </div>
        </div>

        <!-- Message -->
        <div class="form-group">
          <label class="form-label" for="contact-message">Your Message *</label>
          <textarea
            id="contact-message"
            name="message"
            class="form-input"
            rows="5"
            placeholder="Hello Hayasinth, I would like to discuss..."
            required
          ></textarea>
        </div>

        <button type="submit" id="contact-submit-btn" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1rem;">
          Send Message 🚀
        </button>
      </form>
    </div>
  </div>
</section>
