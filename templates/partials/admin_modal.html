<div id="admin-modal" class="modal-overlay">
  <div class="glass-panel" style="width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; border: 1px solid var(--border-accent);">
    <button id="close-admin-btn" class="modal-close-btn" title="Close">✕</button>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
      <span style="font-size: 1.5rem;">⚙️</span>
      <div>
        <h3 style="font-size: 1.3rem; font-weight: 700;">Portfolio Content Manager</h3>
        <p style="color: var(--text-secondary); font-size: 0.85rem;">Add a new project directly to SQLite Database & UI.</p>
      </div>
    </div>

    <form id="admin-add-project-form">
      <div class="form-group">
        <label class="form-label">Project Title *</label>
        <input type="text" name="title" class="form-input" placeholder="e.g. AI-Powered Medical Diagnosis" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select name="category" class="form-input" required>
            <option value="Full Stack">Full Stack</option>
            <option value="Python & SQL">Python & SQL</option>
            <option value="Frontend">Frontend</option>
            <option value="Database">Database</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Featured Badge</label>
          <select name="featured" class="form-input">
            <option value="0">Standard</option>
            <option value="1">★ Featured Project</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description *</label>
        <textarea name="description" class="form-input" rows="3" placeholder="Brief project summary..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Tech Tags (comma-separated)</label>
        <input type="text" name="tags" class="form-input" placeholder="Python, Django, SQLite, JavaScript">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label">GitHub Repository URL</label>
          <input type="url" name="github_url" class="form-input" placeholder="https://github.com/hayasinth284/repo">
        </div>

        <div class="form-group">
          <label class="form-label">Live Demo URL</label>
          <input type="url" name="demo_url" class="form-input" placeholder="https://my-demo.app">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">System Architecture</label>
        <input type="text" name="architecture" class="form-input" placeholder="e.g. Django REST API + SQLite DB + React Frontend">
      </div>

      <div class="form-group">
        <label class="form-label">Key Highlights (semicolon-separated)</label>
        <input type="text" name="key_features" class="form-input" placeholder="Feature 1; Feature 2; Feature 3">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
        Save Project to Database 💾
      </button>
    </form>
  </div>
</div>
